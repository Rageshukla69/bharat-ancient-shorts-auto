name: Automated Bharat Ancient History & Mythology Hindi Shorts (Every 12 Hours)

on:
  schedule:
    # Primary 12-hour slots at off-peak minute :25 (6:55 AM IST & 6:55 PM IST)
    # + Backup catch-up slots (9:55 AM IST & 9:55 PM IST) so GitHub queue congestion can NEVER skip a run!
    # (src/main.py automatically skips backup slots if a Short was already uploaded in the last 9.5 hours)
    - cron: '25 1,4,13,16 * * *'
  workflow_dispatch:
    inputs:
      custom_topic:
        description: 'Optional custom Ancient India / Mythology / Temple Wonder topic (leave blank to auto-pick)'
        required: false
        default: ''
      dry_run:
        description: 'Skip YouTube upload (true = render & preview MP4 only, false = upload to YouTube)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

jobs:
  generate-and-upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up System Dependencies (FFmpeg & Hindi Devanagari Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-unhinted fonts-indic fonts-lohit-deva fonts-montserrat fonts-liberation fonts-dejavu-core libmagic1
          fc-cache -f -v

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Uplifting Documentary Score
        run: |
          python src/sfx_generator.py

      - name: Run End-to-End Ancient India & Mythology Hindi Short Pipeline
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION || 'centralindia' }}
          AZURE_TTS_VOICE: ${{ secrets.AZURE_TTS_VOICE || 'hi-IN-AaravNeural' }}
          BG_MUSIC_VOLUME: ${{ secrets.BG_MUSIC_VOLUME || '0.30' }}
          BGM_URL: ${{ secrets.BGM_URL || '' }}
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          FOUNDRY_IMAGE_MODEL: ${{ secrets.FOUNDRY_IMAGE_MODEL || 'MAI-Image-2.6-Flash' }}
          MAX_AI_IMAGES_PER_SHORT: ${{ secrets.MAX_AI_IMAGES_PER_SHORT || '3' }}
          FOUNDRY_TEXT_API_KEY: ${{ secrets.FOUNDRY_TEXT_API_KEY }}
          FOUNDRY_TEXT_ENDPOINT: ${{ secrets.FOUNDRY_TEXT_ENDPOINT }}
          FOUNDRY_TEXT_MODEL: ${{ secrets.FOUNDRY_TEXT_MODEL || 'gpt-6-luna' }}
          SHORTS_PER_DAY: ${{ secrets.SHORTS_PER_DAY || '2' }}
          VOICE_SPEED_PERCENT: ${{ secrets.VOICE_SPEED_PERCENT || '4' }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python src/main.py

      - name: Upload Rendered Short as Workflow Artifact (Preview / Backup)
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('output/final_short.mp4') != ''
        with:
          name: bharat-hindi-short-${{ github.run_id }}
          path: |
            output/final_short.mp4
            output/subtitles.ass
            output/metadata.json
          retention-days: 7

      - name: Commit Updated Topic Queue & History State
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Bharat Ancient Shorts Bot"
          git add data/topics_seed.json data/used_topics.json data/upload_history.json
          git diff --staged --quiet || git commit -m "chore: record completed ancient india hindi short"
          git push
